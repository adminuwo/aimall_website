name: Trigger auto deployment for aimallweb

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aimallweb-AutoDeployTrigger-8d40fbd5-70c7-4480-a12a-e6c418b030e5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIMALLWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIMALLWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIMALLWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acruwoconnect.azurecr.io
          registryUsername: ${{ secrets.AIMALLWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIMALLWEB_REGISTRY_PASSWORD }}
          containerAppName: aimallweb
          resourceGroup: aimallweb
          imageToBuild: acruwoconnect.azurecr.io/aimallweb:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


